[project]
name = "edge-gateway"
version = "0.1.0"
description = "A resilience-aware edge gateway: timeout budgets, circuit breaking and bulkheads."
requires-python = ">=3.12"

# The RESILIENCE CORE has no runtime dependencies, deliberately — see DECISIONS.md ADR-002.
# `fastapi`/`httpx`/`uvicorn` arrive in slice 4 when there is actually an HTTP surface to serve;
# declaring them now would be declaring a dependency nothing imports, which is how a dependency
# list stops being a description of the software and becomes folklore.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.3",
    "ruff~=0.16",
    "mypy~=2.3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# `pythonpath` rather than requiring `pip install -e .` first: no editable install of this package, no
# build step, no network access at test time. A test suite that needs a setup ritual is a test suite
# that stops being run, and the build step is the part most likely to be the thing that breaks.
# (Since slice 3 the suite does need pytest and pytest-asyncio present — see `asyncio_mode` below —
# but it still never has to *build* or install this project to import it.)
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

# `--strict-markers` above turns a typo'd marker into an error instead of a silent no-op. Without it,
# `@pytest.mark.asyncio` misspelt as `@pytest.mark.asyncoi` makes the test silently never run, and a
# coroutine test function that is never awaited PASSES vacuously.
#
# `asyncio_mode` arrives here with slice 3, which added the first async code — a bulkhead has to be
# able to wait. `strict` is the right one of the two modes: `auto` puts every coroutine test on an
# event loop with no marker, which is convenient, and which means a sync test that grows an `await`
# gets silently reinterpreted instead of reported. Explicit costs one line per test and makes "this
# test needs a loop" a visible property of the test.
asyncio_mode = "strict"

# Setting the key does couple the suite to the plugin, which is why it was not set before there was
# async code to justify it: `--strict-config` makes an unrecognised ini key a hard error, and
# `asyncio_mode` is only recognised while pytest-asyncio is installed — so a missing plugin fails
# collection for every test rather than only the async ones. That is the accepted cost, it is why the
# plugin is pinned in the `dev` extra rather than left to chance, and it is why the README's quick
# start now installs that extra before running pytest.

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # flake8-bugbear — catches the mutable-default and except-blind classes of bug
    "UP",       # pyupgrade — keeps the code in modern idiom, which is one of the stated gaps
    "ASYNC",    # flake8-async — flags blocking calls inside async def, the bug this project is about
    "RUF",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Matching the bar already set in settlement-engine: `mypy --strict` clean, no per-file opt-outs.
# `warn_unreachable` is the one worth calling out — it catches a guard clause that can never fire,
# which is the usual symptom of a state machine whose transitions do not mean what the author thought.
